<svg fill="none" viewBox="0 0 800 260" width="800" height="260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="activityCardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0514" />
      <stop offset="50%" stop-color="#150a24" />
      <stop offset="100%" stop-color="#0c0618" />
    </linearGradient>

    <linearGradient id="activityAreaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(236, 72, 153, 0.4)" />
      <stop offset="60%" stop-color="rgba(168, 85, 247, 0.15)" />
      <stop offset="100%" stop-color="rgba(236, 72, 153, 0)" />
    </linearGradient>

    <linearGradient id="activityLineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="pointGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="1.5" y="1.5" width="797" height="257" rx="16" fill="url(#activityCardBg)" stroke="rgba(236, 72, 153, 0.35)" stroke-width="1.5" />

  <!-- Header Accent Line -->
  <path d="M 2 50 L 438 50" stroke="rgba(236, 72, 153, 0.2)" stroke-width="1" />

  <!-- Header Title -->
  <g transform="translate(24, 32)">
    <circle cx="6" cy="-4" r="4" fill="#38bdf8" filter="url(#pointGlow)" />
    <text x="18" y="1" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" letter-spacing="0.02em">📈 Contribution &amp; Development Activity</text>
    <text x="750" y="1" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="end">450+ Contributions</text>
  </g>

  <!-- Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" stroke-dasharray="4,4">
    <line x1="45" y1="80" x2="755" y2="80" />
    <line x1="45" y1="120" x2="755" y2="120" />
    <line x1="45" y1="160" x2="755" y2="160" />
    <line x1="45" y1="200" x2="755" y2="200" />
  </g>

  <!-- Area Graph Fill -->
  <path d="M 45 200 
           L 45 160 
           Q 105 130 165 150 
           T 285 110 
           T 405 140 
           T 525 85 
           T 645 105 
           T 755 70 
           L 755 200 Z" 
        fill="url(#activityAreaGrad)" />

  <!-- Activity Curve Line -->
  <path d="M 45 160 
           Q 105 130 165 150 
           T 285 110 
           T 405 140 
           T 525 85 
           T 645 105 
           T 755 70" 
        fill="none" stroke="url(#activityLineGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Data Points -->
  <circle cx="45" cy="160" r="4.5" fill="#fdf4ff" stroke="#ec4899" stroke-width="2" filter="url(#pointGlow)" />
  <circle cx="165" cy="150" r="4.5" fill="#fdf4ff" stroke="#ec4899" stroke-width="2" filter="url(#pointGlow)" />
  <circle cx="285" cy="110" r="4.5" fill="#fdf4ff" stroke="#a855f7" stroke-width="2" filter="url(#pointGlow)" />
  <circle cx="405" cy="140" r="4.5" fill="#fdf4ff" stroke="#a855f7" stroke-width="2" filter="url(#pointGlow)" />
  <circle cx="525" cy="85" r="5" fill="#fdf4ff" stroke="#38bdf8" stroke-width="2.5" filter="url(#pointGlow)" />
  <circle cx="645" cy="105" r="4.5" fill="#fdf4ff" stroke="#38bdf8" stroke-width="2" filter="url(#pointGlow)" />
  <circle cx="755" cy="70" r="5.5" fill="#38bdf8" stroke="#fdf4ff" stroke-width="2" filter="url(#pointGlow)" />

  <!-- Month Labels -->
  <g fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">
    <text x="45" y="225" text-anchor="middle">Jan</text>
    <text x="165" y="225" text-anchor="middle">Mar</text>
    <text x="285" y="225" text-anchor="middle">May</text>
    <text x="405" y="225" text-anchor="middle">Jul</text>
    <text x="525" y="225" text-anchor="middle">Sep</text>
    <text x="645" y="225" text-anchor="middle">Nov</text>
    <text x="755" y="225" text-anchor="middle">Current</text>
  </g>
</svg>