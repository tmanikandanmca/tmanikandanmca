<svg fill="none" viewBox="0 0 800 195" width="800" height="195" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="streakCardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0514" />
      <stop offset="50%" stop-color="#150a24" />
      <stop offset="100%" stop-color="#0c0618" />
    </linearGradient>

    <linearGradient id="streakFireGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="centerPillBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="boxGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ec4899" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    @keyframes flamePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px #ec4899); }
      50% { transform: scale(1.1); filter: drop-shadow(0 0 14px #f43f5e); }
    }
    .flame-icon {
      transform-origin: 400px 58px;
      animation: flamePulse 2s ease-in-out infinite;
    }
  </style>

  <!-- Outer Card Background -->
  <rect x="1.5" y="1.5" width="797" height="192" rx="16" fill="url(#streakCardBg)" stroke="rgba(236, 72, 153, 0.35)" stroke-width="1.5" />

  <!-- Center Highlight Panel (Current Streak) -->
  <rect x="270" y="16" width="260" height="163" rx="14" fill="rgba(236, 72, 153, 0.08)" stroke="url(#centerPillBorder)" stroke-width="1.5" filter="url(#boxGlow)" />

  <!-- ==================== LEFT PANEL: TOTAL CONTRIBUTIONS ==================== -->
  <g transform="translate(135, 95)" text-anchor="middle">
    <!-- Icon -->
    <circle cx="0" cy="-35" r="16" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1.2" />
    <path d="M-6 -35 L6 -35 M0 -41 L0 -29 M-4 -39 L4 -31" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Count -->
    <text x="0" y="2" fill="#fdf4ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="900">450+</text>
    
    <!-- Label -->
    <text x="0" y="24" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Total Contributions</text>
    
    <!-- Subtext -->
    <text x="0" y="44" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">2024 — Present</text>
  </g>

  <!-- Divider Line 1 -->
  <line x1="260" y1="35" x2="260" y2="160" stroke="rgba(236, 72, 153, 0.15)" stroke-width="1" stroke-dasharray="4,4" />

  <!-- ==================== CENTER PANEL: CURRENT STREAK ==================== -->
  <g transform="translate(400, 95)" text-anchor="middle">
    <!-- Animated Fire Icon -->
    <g class="flame-icon">
      <circle cx="0" cy="-40" r="18" fill="rgba(236, 72, 153, 0.2)" stroke="#ec4899" stroke-width="1.5" filter="url(#fireGlow)" />
      <text x="0" y="-32" font-size="20" text-anchor="middle">🔥</text>
    </g>

    <!-- Count -->
    <text x="0" y="2" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="900" filter="url(#fireGlow)">14 Days</text>
    
    <!-- Label -->
    <text x="0" y="24" fill="#fdf4ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800">Current Streak</text>
    
    <!-- Subtext -->
    <text x="0" y="44" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700">● Continuous Active Dev</text>
  </g>

  <!-- Divider Line 2 -->
  <line x1="540" y1="35" x2="540" y2="160" stroke="rgba(236, 72, 153, 0.15)" stroke-width="1" stroke-dasharray="4,4" />

  <!-- ==================== RIGHT PANEL: LONGEST STREAK ==================== -->
  <g transform="translate(665, 95)" text-anchor="middle">
    <!-- Icon -->
    <circle cx="0" cy="-35" r="16" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.2" />
    <path d="M-6 -31 L-2 -37 L2 -33 L6 -39" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Count -->
    <text x="0" y="2" fill="#fdf4ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="900">42 Days</text>
    
    <!-- Label -->
    <text x="0" y="24" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Longest Streak</text>
    
    <!-- Subtext -->
    <text x="0" y="44" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Consistency Master</text>
  </g>
</svg>