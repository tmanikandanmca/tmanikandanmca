<svg fill="none" viewBox="0 0 440 210" width="440" height="210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="statsCardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0514" />
      <stop offset="50%" stop-color="#150a24" />
      <stop offset="100%" stop-color="#0c0618" />
    </linearGradient>

    <linearGradient id="statsRankGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="neonStatGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseRingStat {
      0%, 100% { stroke-dashoffset: 55; }
      50% { stroke-dashoffset: 35; }
    }
    @keyframes fadeInOnly {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .stat-row-anim {
      animation: fadeInOnly 1s ease-out forwards;
    }
    .rank-ring-anim {
      stroke-dasharray: 230;
      animation: pulseRingStat 3.5s ease-in-out infinite;
    }
  </style>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="437" height="207" rx="16" fill="url(#statsCardBg)" stroke="rgba(236, 72, 153, 0.35)" stroke-width="1.5" />
  
  <!-- Header Accent Line -->
  <path d="M 2 46 L 438 46" stroke="rgba(236, 72, 153, 0.2)" stroke-width="1" />

  <!-- Header Title -->
  <g transform="translate(24, 30)">
    <circle cx="6" cy="-4" r="4" fill="#ec4899" filter="url(#neonStatGlow)" />
    <text x="18" y="1" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" letter-spacing="0.02em">⚡ Manikandan's GitHub Stats</text>
  </g>

  <!-- Stat Items -->
  <g transform="translate(24, 76)" class="stat-row-anim">
    <!-- Total Stars -->
    <g transform="translate(0, 0)">
      <path d="M6 0 L7.8 4 L12 4.4 L8.8 7.3 L9.8 11.5 L6 9.2 L2.2 11.5 L3.2 7.3 L0 4.4 L4.2 4 Z" fill="#fbbf24" transform="translate(0, 2)" />
      <text x="24" y="13" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Total Stars Earned:</text>
      <text x="185" y="13" fill="#fdf4ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">10+</text>
    </g>

    <!-- Total Commits -->
    <g transform="translate(0, 30)">
      <circle cx="6" cy="8" r="4" fill="none" stroke="#34d399" stroke-width="2" />
      <line x1="0" y1="8" x2="2" y2="8" stroke="#34d399" stroke-width="2" />
      <line x1="10" y1="8" x2="12" y2="8" stroke="#34d399" stroke-width="2" />
      <text x="24" y="13" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Total Commits:</text>
      <text x="185" y="13" fill="#fdf4ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">320+</text>
    </g>

    <!-- Public Repositories -->
    <g transform="translate(0, 60)">
      <path d="M2 1 C1 1 0 2 0 3 L0 11 C0 12 1 13 2 13 L10 13 C11 13 12 12 12 11 L12 3 C12 2 11 1 10 1 Z M3 3 L9 3 M3 6 L7 6" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" transform="translate(0, 1)" />
      <text x="24" y="13" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Public Repositories:</text>
      <text x="185" y="13" fill="#fdf4ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">26</text>
    </g>

    <!-- Contributions & PRs -->
    <g transform="translate(0, 90)">
      <circle cx="3" cy="3" r="2" fill="#38bdf8" />
      <circle cx="3" cy="11" r="2" fill="#38bdf8" />
      <circle cx="9" cy="5" r="2" fill="#38bdf8" />
      <path d="M3 5 L3 9 M9 7 L9 9 C9 10 8 11 7 11 L5 11" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <text x="24" y="13" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Total Contributions:</text>
      <text x="185" y="13" fill="#fdf4ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">450+</text>
    </g>
  </g>

  <!-- Rank Progress Ring Badge (Right Side) -->
  <g transform="translate(345, 125)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="rgba(236, 72, 153, 0.15)" stroke-width="5" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#statsRankGrad)" stroke-width="5" stroke-linecap="round" class="rank-ring-anim" transform="rotate(-90)" filter="url(#neonStatGlow)" />
    <text x="0" y="8" fill="#fdf4ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" text-anchor="middle">A+</text>
    <text x="0" y="24" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="1.5">ARCHITECT</text>
  </g>
</svg>