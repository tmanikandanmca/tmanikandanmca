<svg fill="none" viewBox="0 0 440 200" width="440" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="statsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>

    <linearGradient id="rankRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="glowStats" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseRing {
      0%, 100% { stroke-dashoffset: 60; }
      50% { stroke-dashoffset: 40; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .stat-row {
      animation: fadeIn 0.8s ease-out forwards;
    }
    .ring-circle {
      stroke-dasharray: 220;
      animation: pulseRing 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="437" height="197" rx="14" fill="url(#statsBg)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Header Border Accent -->
  <path d="M 2 42 L 438 42" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" />

  <!-- Header Title -->
  <g transform="translate(24, 28)">
    <circle cx="6" cy="-4" r="3.5" fill="#38bdf8" filter="url(#glowStats)" />
    <text x="18" y="0" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="0.02em">Manikandan's GitHub Stats</text>
  </g>

  <!-- Stat Items -->
  <g transform="translate(24, 66)" class="stat-row">
    <!-- Total Stars -->
    <g transform="translate(0, 0)">
      <!-- Star Icon -->
      <path d="M6 0 L7.8 4 L12 4.4 L8.8 7.3 L9.8 11.5 L6 9.2 L2.2 11.5 L3.2 7.3 L0 4.4 L4.2 4 Z" fill="#fbbf24" transform="translate(0, 2)" />
      <text x="24" y="12" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Total Stars Earned:</text>
      <text x="175" y="12" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">10+</text>
    </g>

    <!-- Total Commits -->
    <g transform="translate(0, 28)">
      <!-- Commit Icon -->
      <circle cx="6" cy="8" r="4" fill="none" stroke="#34d399" stroke-width="2" />
      <line x1="0" y1="8" x2="2" y2="8" stroke="#34d399" stroke-width="2" />
      <line x1="10" y1="8" x2="12" y2="8" stroke="#34d399" stroke-width="2" />
      <text x="24" y="12" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Total Commits:</text>
      <text x="175" y="12" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">320+</text>
    </g>

    <!-- Public Repositories -->
    <g transform="translate(0, 56)">
      <!-- Repo Icon -->
      <path d="M2 1 C1 1 0 2 0 3 L0 11 C0 12 1 13 2 13 L10 13 C11 13 12 12 12 11 L12 3 C12 2 11 1 10 1 Z M3 3 L9 3 M3 6 L7 6" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" transform="translate(0, 1)" />
      <text x="24" y="12" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Total Repositories:</text>
      <text x="175" y="12" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">26</text>
    </g>

    <!-- Contributions & PRs -->
    <g transform="translate(0, 84)">
      <!-- PR Icon -->
      <circle cx="3" cy="3" r="2" fill="#38bdf8" />
      <circle cx="3" cy="11" r="2" fill="#38bdf8" />
      <circle cx="9" cy="5" r="2" fill="#38bdf8" />
      <path d="M3 5 L3 9 M9 7 L9 9 C9 10 8 11 7 11 L5 11" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <text x="24" y="12" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Total Contributions:</text>
      <text x="175" y="12" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">450+</text>
    </g>
  </g>

  <!-- Grade Badge (Right Side) -->
  <g transform="translate(340, 115)">
    <!-- Outer Track -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#1e293b" stroke-width="5" />
    <!-- Gradient Progress Ring -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="url(#rankRing)" stroke-width="5" stroke-linecap="round" class="ring-circle" transform="rotate(-90)" filter="url(#glowStats)" />
    <!-- Center Letter -->
    <text x="0" y="7" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" text-anchor="middle">A+</text>
    <text x="0" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="1">TIER</text>
  </g>
</svg>
