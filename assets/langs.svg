<svg fill="none" viewBox="0 0 440 200" width="440" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="langsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>

    <filter id="glowLangs" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes barGrow {
      from { width: 0; }
    }
    .lang-bar {
      animation: barGrow 1.2s ease-out forwards;
    }
  </style>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="437" height="197" rx="14" fill="url(#langsBg)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Header Border Accent -->
  <path d="M 2 42 L 438 42" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" />

  <!-- Header Title -->
  <g transform="translate(24, 28)">
    <circle cx="6" cy="-4" r="3.5" fill="#818cf8" filter="url(#glowLangs)" />
    <text x="18" y="0" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="0.02em">Most Used Languages</text>
  </g>

  <!-- Multi-Segment Top Progress Bar -->
  <g transform="translate(24, 56)">
    <!-- Track -->
    <rect x="0" y="0" width="392" height="8" rx="4" fill="#1e293b" />
    <!-- C# (45%) -->
    <rect x="0" y="0" width="176" height="8" rx="4" fill="#239120" />
    <!-- TypeScript / Angular (30%) -->
    <rect x="178" y="0" width="118" height="8" rx="2" fill="#3178c6" />
    <!-- SQL (13%) -->
    <rect x="298" y="0" width="51" height="8" rx="2" fill="#cc2927" />
    <!-- HTML/CSS (8%) -->
    <rect x="351" y="0" width="31" height="8" rx="2" fill="#e34c26" />
    <!-- Other (4%) -->
    <rect x="384" y="0" width="8" height="8" rx="2" fill="#34d399" />
  </g>

  <!-- Language Legend Columns -->
  <g transform="translate(24, 86)">
    <!-- Column 1 -->
    <!-- C# / .NET -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="5" fill="#239120" />
      <text x="18" y="10" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">C# / .NET</text>
      <text x="110" y="10" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">45.0%</text>
    </g>

    <!-- TypeScript / Angular -->
    <g transform="translate(0, 32)">
      <circle cx="6" cy="6" r="5" fill="#3178c6" />
      <text x="18" y="10" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">TypeScript</text>
      <text x="110" y="10" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">30.0%</text>
    </g>

    <!-- SQL Server / PG -->
    <g transform="translate(0, 64)">
      <circle cx="6" cy="6" r="5" fill="#cc2927" />
      <text x="18" y="10" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">SQL Server</text>
      <text x="110" y="10" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">13.0%</text>
    </g>

    <!-- Column 2 -->
    <!-- HTML / CSS -->
    <g transform="translate(210, 0)">
      <circle cx="6" cy="6" r="5" fill="#e34c26" />
      <text x="18" y="10" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">HTML / CSS</text>
      <text x="115" y="10" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">8.0%</text>
    </g>

    <!-- Docker & Shell -->
    <g transform="translate(210, 32)">
      <circle cx="6" cy="6" r="5" fill="#34d399" />
      <text x="18" y="10" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Docker / Shell</text>
      <text x="115" y="10" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">4.0%</text>
    </g>
  </g>
</svg>
