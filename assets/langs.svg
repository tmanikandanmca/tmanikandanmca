<svg fill="none" viewBox="0 0 440 210" width="440" height="210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="langsCardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0514" />
      <stop offset="50%" stop-color="#150a24" />
      <stop offset="100%" stop-color="#0c0618" />
    </linearGradient>

    <filter id="neonLangGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="437" height="207" rx="16" fill="url(#langsCardBg)" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1.5" />
  
  <!-- Header Accent Line -->
  <path d="M 2 46 L 438 46" stroke="rgba(236, 72, 153, 0.2)" stroke-width="1" />

  <!-- Header Title -->
  <g transform="translate(24, 30)">
    <circle cx="6" cy="-4" r="4" fill="#a855f7" filter="url(#neonLangGlow)" />
    <text x="18" y="1" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" letter-spacing="0.02em">🚀 Most Used Languages &amp; Stacks</text>
  </g>

  <!-- Multi-Segment Top Bar -->
  <g transform="translate(24, 62)">
    <rect x="0" y="0" width="392" height="9" rx="4.5" fill="rgba(255, 255, 255, 0.08)" />
    <!-- C# (45%) -->
    <rect x="0" y="0" width="176" height="9" rx="4.5" fill="#ec4899" />
    <!-- TypeScript (30%) -->
    <rect x="178" y="0" width="118" height="9" rx="2" fill="#a855f7" />
    <!-- SQL (13%) -->
    <rect x="298" y="0" width="51" height="9" rx="2" fill="#38bdf8" />
    <!-- HTML/CSS (8%) -->
    <rect x="351" y="0" width="31" height="9" rx="2" fill="#f43f5e" />
    <!-- Docker/Other (4%) -->
    <rect x="384" y="0" width="8" height="9" rx="2" fill="#34d399" />
  </g>

  <!-- Language Details List -->
  <g transform="translate(24, 94)">
    <!-- Column 1 -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="5" fill="#ec4899" />
      <text x="18" y="10" fill="#fdf4ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">C# / .NET 10</text>
      <text x="115" y="10" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">45.0%</text>
    </g>

    <g transform="translate(0, 34)">
      <circle cx="6" cy="6" r="5" fill="#a855f7" />
      <text x="18" y="10" fill="#fdf4ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">TypeScript / Angular</text>
      <text x="160" y="10" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">30.0%</text>
    </g>

    <g transform="translate(0, 68)">
      <circle cx="6" cy="6" r="5" fill="#38bdf8" />
      <text x="18" y="10" fill="#fdf4ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">SQL Server &amp; Postgres</text>
      <text x="165" y="10" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">13.0%</text>
    </g>

    <!-- Column 2 -->
    <g transform="translate(230, 0)">
      <circle cx="6" cy="6" r="5" fill="#f43f5e" />
      <text x="18" y="10" fill="#fdf4ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">HTML &amp; CSS</text>
      <text x="110" y="10" fill="#fecdd3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">8.0%</text>
    </g>

    <g transform="translate(230, 34)">
      <circle cx="6" cy="6" r="5" fill="#34d399" />
      <text x="18" y="10" fill="#fdf4ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Docker &amp; CI/CD</text>
      <text x="115" y="10" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">4.0%</text>
    </g>
  </g>
</svg>